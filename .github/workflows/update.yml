name: Update block lists

on:
  schedule:
    - cron: "17 3 * * 0,2-6" # daily, 03:17 UTC
    - cron: "17 3 * * 1" # Mondays: also re-discover live-streaming servers
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - lists.json
      - sources.json
      - allowlist.txt
      - custom/**
      - apps/**
      - ips.json
      - scripts/**
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Re-discover live-streaming app servers weekly (Mondays), on manual runs and when the app list changes.
      - name: Discover live-streaming app servers
        if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * 1'
        continue-on-error: true
        timeout-minutes: 45
        run: python3 scripts/discover_streaming.py

      - name: Build lists
        id: build
        continue-on-error: true
        run: python3 scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ./*.txt adblock hosts ips data README.md
          # build.py leaves files untouched when only the timestamp would change.
          if git diff --cached --quiet; then
            echo "No list changes."
          else
            git commit -m "Update block lists $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: Report failed sources
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Some lists were not updated because a source failed or shrank too much. See the 'Build lists' step."
          exit 1

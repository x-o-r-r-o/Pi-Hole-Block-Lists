name: Update block lists

on:
  schedule:
    - cron: "17 3 * * 0,2-6" # daily, 03:17 UTC
    - cron: "17 3 * * 1" # Mondays: also re-discover app servers
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - lists.json
      - sources.json
      - allowlist.txt
      - custom/**
      - apps/**
      - ips.json
      - scripts/**
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Re-discover app servers weekly (Mondays), on manual runs and when the app list changes.
      - name: Discover app servers (apps/*.json)
        if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * 1'
        continue-on-error: true
        timeout-minutes: 60
        run: python3 scripts/discover_apps.py

      - name: Build lists
        id: build
        continue-on-error: true
        run: python3 scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ./*.txt adblock hosts ips data README.md
          # build.py leaves files untouched when only the timestamp would change.
          if git diff --cached --quiet; then
            echo "No list changes."
          else
            git commit -m "Update block lists $(date -u '+%Y-%m-%d')"
            # Someone may have pushed while we were building: replay our generated files on top.
            for i in 1 2 3; do
              git pull --rebase -X theirs origin master && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            if [ -n "$(git log origin/master..HEAD --oneline)" ]; then
              echo "::error::Could not push the updated lists."
              exit 1
            fi
          fi

      - name: Report failed sources
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Some lists were not updated because a source failed or shrank too much. See the 'Build lists' step."
          exit 1
